# Render Blueprint: web dashboard + Postgres + scheduled reg pool sync.
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
databases:
  - name: insights-db
    plan: basic-256mb
    region: frankfurt       # must match the services: internal DB hostnames only resolve in-region
    databaseName: insights
    user: insights

envVarGroups:
  - name: insights-shared
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: INGEST_TOKEN
        generateValue: true
      # Reg pool feeds - one pair per show. Fill in on Render once the export URL is known.
      # - key: REGPOOL_LEX26_URL
      #   sync: false
      # - key: REGPOOL_LEX26_TOKEN
      #   sync: false

services:
  - type: web
    name: customer-insights
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - fromGroup: insights-shared
      - key: DATABASE_URL
        fromDatabase: { name: insights-db, property: connectionString }
      - key: DASHBOARD_USER
        value: blueprint
      - key: DASHBOARD_PASSWORD
        sync: false        # set in the Render dashboard on first deploy

  - type: cron
    name: customer-insights-sync
    runtime: python
    plan: starter
    region: frankfurt
    schedule: "0 * * * *"   # hourly; tighten to */15 during show build-up
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.sync
    envVars:
      - fromGroup: insights-shared
      - key: DATABASE_URL
        fromDatabase: { name: insights-db, property: connectionString }
