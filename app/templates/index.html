<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Insights</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232a78d6'/><rect x='7' y='16' width='4' height='9' rx='1.5' fill='white'/><rect x='14' y='10' width='4' height='15' rx='1.5' fill='white'/><rect x='21' y='6' width='4' height='19' rx='1.5' fill='white'/></svg>">
  <link rel="stylesheet" href="/static/app.css?v=3">
  <script>try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <div class="brand-title">Customer Insights</div>
          <div class="brand-sub">Lubricant Expo portfolio</div>
        </div>
      </div>
      <nav class="regions" id="regions" aria-label="Show"></nav>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn" onclick="window.print()" title="Print / save as PDF" aria-label="Print">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        </button>
      </div>
    </div>
  </header>

  <section class="hero" id="hero"></section>

  <nav class="tabs" id="tabs" aria-label="Section">
    <div class="tabs-inner">
      <button data-tab="audience" class="active">Audience</button>
      <button data-tab="behaviour">Behaviour</button>
      <button data-tab="geography">Geography</button>
      <button data-tab="commercial">Commercial</button>
      <button data-tab="journey">Journey</button>
      <button data-tab="gaps">Who are we missing?</button>
      <button data-tab="compare">Compare shows</button>
      <button data-tab="sources">Data &amp; sources</button>
    </div>
  </nav>

  <main class="wrap" id="main">
    <div class="loading">Loading insights…</div>
  </main>

  <footer class="foot wrap">
    <span id="footMeta"></span>
    <span>Aggregated data only. Personal details are never shown on this dashboard.</span>
  </footer>

  <div class="tooltip" id="mapTip" role="tooltip"></div>

  <script src="/static/vendor/chart.umd.min.js"></script>
  <script src="/static/vendor/d3.min.js"></script>
  <script src="/static/vendor/topojson.min.js"></script>
  <script src="/static/app.js?v=3"></script>
</body>
</html>
